# Memory service configuration for Yantra.
# All intervals are in seconds.

[heartbeat]
# How often the heartbeat fires to consolidate and summarize sessions.
interval_seconds = 30
# Maximum number of sessions to summarize per heartbeat tick.
max_sessions_per_tick = 10

[recall]
# Maximum number of turns to keep in active recall per session.
max_turns_per_session = 1000
# How many days before an inactive session is archived.
session_archive_ttl_days = 7

[archival]
# Embedding vector dimensionality. Changing this requires re-embedding all shards.
embedding_dims = 64
# How many days before an archived shard is eligible for deletion.
shard_ttl_days = 90
# Maximum number of search results returned from archival search.
max_search_results = 20

[working]
# Token budget for assembling the working context prompt.
default_token_budget = 4096
