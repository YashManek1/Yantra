name: Nightly Evaluation

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  NIGHTLY_TRACKING_ISSUE: "1"

jobs:
  swebench-placeholder:
    name: SWE-bench Verified Placeholder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust stable toolchain
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --no-modify-path
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup update stable --no-self-update
          rustup default stable
        shell: bash

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ubuntu-latest-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-

      - name: Run forge-eval placeholder
        run: |
          cargo run --bin yantra-eval -- --placeholder swe-bench-verified > nightly-results.md
          {
            echo "## Nightly SWE-bench Verified Placeholder"
            echo
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```text'
            cat nightly-results.md
            echo '```'
          } > nightly-comment.md

      - name: Post results to tracking issue
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "$NIGHTLY_TRACKING_ISSUE" --body-file nightly-comment.md
