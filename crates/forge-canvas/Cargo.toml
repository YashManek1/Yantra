[package]
name        = "yantra-canvas"
description = "Browser-based visual editor + CRG graph viewer host (canvas, graph)"
version.workspace   = true
edition.workspace   = true
authors.workspace   = true
license.workspace   = true
publish             = false

[[bin]]
name = "yantra-canvas"
path = "src/main.rs"

[dependencies]
yantra-core.workspace      = true
yantra-obs.workspace       = true
yantra-router.workspace    = true
yantra-crg.workspace       = true
yantra-tokenizer.workspace = true
yantra-tools.workspace     = true
thiserror.workspace        = true
tracing.workspace          = true
tracing-subscriber.workspace = true
tokio.workspace            = true
serde.workspace            = true
serde_json.workspace       = true
clap.workspace             = true
anyhow.workspace           = true
axum                       = { version = "0.8", features = ["tokio", "ws"] }
chrono.workspace           = true
futures-util.workspace     = true
futures-core.workspace     = true
reqwest.workspace          = true
scraper.workspace          = true
lightningcss.workspace     = true
url.workspace              = true
ego-tree.workspace         = true
ring.workspace             = true
rusqlite.workspace         = true

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

[lints]
workspace = true
