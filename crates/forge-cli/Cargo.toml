[package]
name        = "yantra-cli"
description = "clap + ratatui CLI entry point for the Yantra runtime"
version.workspace   = true
edition.workspace   = true
authors.workspace   = true
license.workspace   = true
publish             = false

[[bin]]
name = "yantra"
path = "src/main.rs"

[dependencies]
yantra-core.workspace         = true
yantra-canvas.workspace       = true
yantra-night.workspace        = true
yantra-orchestrator.workspace = true
yantra-stvp.workspace         = true
yantra-agents.workspace       = true
yantra-router.workspace       = true
yantra-ast.workspace          = true
yantra-crg.workspace          = true
yantra-lsp.workspace          = true
yantra-tokenizer.workspace    = true
yantra-obs.workspace          = true
yantra-tools.workspace        = true
yantra-verifier.workspace     = true
yantra-memory.workspace       = true
futures-core.workspace        = true
futures-util.workspace        = true
async-trait.workspace         = true
clap.workspace                = true
serde.workspace               = true
toml.workspace               = true
anyhow.workspace              = true
tracing.workspace             = true
tracing-subscriber.workspace  = true
tokio.workspace               = true
rusqlite.workspace            = true
chrono.workspace              = true
serde_json.workspace          = true
inquire.workspace             = true
regex.workspace               = true
uuid.workspace                = true
yantra-skills.workspace       = true
ratatui.workspace             = true
crossterm.workspace           = true
syntect.workspace             = true
webbrowser.workspace          = true
url.workspace                 = true
scraper.workspace             = true

[build-dependencies]
winresource = { version = "0.1", optional = false }

[lints]
workspace = true
