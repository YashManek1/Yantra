[package]
name        = "yantra-cli"
description = "clap + ratatui CLI entry point for the Yantra runtime"
version.workspace   = true
edition.workspace   = true
authors.workspace   = true
license.workspace   = true
publish             = false

[[bin]]
name = "yantra"
path = "src/main.rs"

[dependencies]
yantra-core.workspace         = true
yantra-serve.workspace        = true
yantra-night.workspace        = true
yantra-orchestrator.workspace = true
yantra-obs.workspace          = true
clap.workspace                = true
anyhow.workspace              = true
tracing.workspace             = true
tracing-subscriber.workspace  = true
tokio.workspace               = true

[lints]
workspace = true
