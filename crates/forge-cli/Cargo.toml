description = "clap + ratatui CLI entry point for the Yantra runtime"
version.workspace   = true
edition.workspace   = true
authors.workspace   = true
license.workspace   = true
publish             = false

[[bin]]
name = "yantra"
path = "src/main.rs"

[dependencies]
